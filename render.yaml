services:
  - type: web
    name: trustpay-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: trustpay-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: TRUSTPAY_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRUSTPAY_API_KEY
        generateValue: true
      - key: CHANNEL3_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: VITE_AG_STUDIO_LICENSE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
